[project]
name = "discovery-jira-api"
version = "0.1.0"
description = "Discovery to Jira API"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langsmith>=0.14.17",
    "openai>=3.42.1",
    "psycopg[binary]>=3.2",
    "pydantic",
    "pydantic-settings>=2.16.2",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
